name: Release

on:
  push:
    branches: [main]

# Only one release may be in flight. A second push while `changeset version` is rewriting
# manifests would race the first over the same Release PR branch.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Actions are pinned by commit, not by tag: a tag is a pointer its owner can move, and this job
  # holds `id-token: write`. Whoever runs here can publish to npm as us. Dependabot bumps the pins
  # and keeps the version comment honest.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Opening and updating the Release PR.
      contents: write
      pull-requests: write
      # The whole point: npm exchanges this for a short-lived publish credential, so no
      # NPM_TOKEN exists anywhere to leak. It is also what makes npm attach provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets reads the history to work out what has already been released.
          fetch-depth: 0
          # Credentials stay, unlike in CI: `changesets/action` pushes the Release PR branch with them.
          persist-credentials: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Deliberate, and not a performance choice: a poisoned dependency cache can expose
          # the OIDC token to attacker-controlled install scripts. setup-node's own OIDC
          # guidance says to turn it off in publishing workflows.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node 24 may be older,
      # and `changeset publish` shells out to whichever npm is on PATH.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance is asked for here rather than in each `publishConfig`, so that the one
          # publish that cannot run here — the first one, which npm requires to happen before a
          # trusted publisher can be configured at all — is not blocked by it. Provenance can only
          # be generated on a cloud CI runner; a manifest demanding it makes a local `npm publish`
          # fail outright.
          NPM_CONFIG_PROVENANCE: 'true'
