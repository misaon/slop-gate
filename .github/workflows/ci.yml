name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

# A push to a pull request makes every run before it irrelevant, so they are cancelled rather than
# left to finish. Pushes to `main` are not cancelled: each commit's result is the record of whether
# that commit was green, and a superseded run would leave a gap in it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every commit, not the pull request title, because this repository merges by rebase only:
  # each commit lands on `main` verbatim and has to stand on its own. Its own job rather than a
  # step in the matrix — the answer cannot differ by operating system or Node version, and
  # paying for it six times would only slow the feedback down.
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing here pushes. Left on, the token sits in `.git/config` for every later step and
          # anything they run to read.
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # One Node version, matching `engines`. The matrix also carried '26', which passed
        # consistently — it was dropped for costing six jobs instead of three, not for failing.
        # Re-add it when 26 is a version contributors actually run.
        node: ['24']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Uploading the SARIF report. Scoped to this job rather than the workflow, so `commitlint` —
      # which runs a third-party action against pull request text — cannot reach the Security tab.
      security-events: write
    # Generous against a cold cache on Windows, and far below the six-hour default that let a stuck
    # job hold a runner all afternoon.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
        if: always()
      - run: pnpm generate:registry:check
        if: always()
      - run: pnpm test
        if: always()
      # `pnpm dogfood`, not an inlined `sgate check`, so this step and the script a contributor runs
      # locally cannot drift apart: there is only one definition of the invocation, in package.json.
      # The extra reports are appended as arguments rather than given their own script, for the same
      # reason — the flags differ, the invocation does not. One run feeds all four consumers: the human
      # log, the inline annotations, the SARIF upload and the summary. Three runs would each send their
      # own telemetry event and triple the count this project uses to tune rules.
      #
      # The script's own `pnpm build` is a turbo cache hit here, the `pnpm build` step above having
      # already produced every `dist` — the dogfood runs the built CLI on purpose, because that is the
      # artefact a user installs and the one thing `pnpm test`'s source alias cannot cover.
      - run: pnpm dogfood --report github,sarif:sgate.sarif,json:sgate.json
        if: always()

      # Reached whatever the gate said, because a red gate is exactly when the findings are worth
      # reading. Only from the Linux job: three matrix entries uploading the same findings would
      # triple every alert in the Security tab.
      - name: Summarise findings
        if: always() && matrix.os == 'ubuntu-latest'
        run: node scripts/ci-summary.mjs sgate.json

      - name: Upload SARIF
        if: always() && matrix.os == 'ubuntu-latest'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: sgate.sarif
          category: slop-gate

  # The counters that gate a run's cost live in `pnpm test` and so run in the matrix above; those are
  # exact and hardware-independent. This job is the other half: the per-call cost of the hot paths, which
  # is a duration and therefore cannot be gated on a shared runner — a GitHub runner's wall clock varies
  # by more than 30%. CodSpeed replaces the timing loop with CPU instrumentation, which brings that under
  # 1% and is free for a public repository with an OSI licence.
  #
  # The macro KPIs — cold and warm `sgate check`, peak RSS — are deliberately not here. They are a wall
  # clock too, and instrumenting them would mean instrumenting oxlint, tsc and biome, which are separate
  # binaries in three other languages. `pnpm perf` measures those against a baseline recorded on one
  # machine, and refuses to compare across hardware.
  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: CodSpeedHQ/action@0ca9cbbf4623b599a6c3ed4fc8a922942705d9f1 # v5.0.2
        with:
          run: pnpm bench
          token: ${{ secrets.CODSPEED_TOKEN }}
