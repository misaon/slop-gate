name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  # Every commit, not the pull request title, because this repository merges by rebase only:
  # each commit lands on `main` verbatim and has to stand on its own. Its own job rather than a
  # step in the matrix — the answer cannot differ by operating system or Node version, and
  # paying for it six times would only slow the feedback down.
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # One Node version, matching `engines`. The matrix carried '26' as well and both of those
        # jobs hit the 15-minute timeout rather than failing a test — so it was buying no coverage
        # and costing every pull request a quarter of an hour. Worth re-adding deliberately, with
        # that hang understood first, when 26 is a version anyone runs.
        node: ['24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
        if: always()
      - run: pnpm generate:registry:check
        if: always()
      - run: pnpm test
        if: always()
      # `pnpm dogfood`, not an inlined `sgate check`, so this step and the script a contributor runs
      # locally cannot drift apart: there is only one definition of the invocation, in package.json.
      # The script's own `pnpm build` is a turbo cache hit here, the `pnpm build` step above having
      # already produced every `dist` — the dogfood runs the built CLI on purpose, because that is the
      # artefact a user installs and the one thing `pnpm test`'s source alias cannot cover.
      - run: pnpm dogfood
        if: always()
