version: 2
updates:
  # The analysers are the product. An oxlint or knip bump changes what this tool reports, so
  # these land as individual pull requests that CI and the dogfood get to argue with — a
  # grouped bump would hide which upgrade moved the numbers.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    ignore:
      # `@types/node` describes a Node *major*, and `engines.node` here is `>=24`. Typechecking
      # against 26's surface would let a Node 26-only API compile and then throw on the oldest
      # runtime this package claims to support — a break CI cannot catch, because `pnpm typecheck`
      # runs once against whatever is installed rather than once per matrix entry. Pinned to the
      # minimum supported major deliberately; raise it when `engines.node` rises.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # A compromised npm release is usually yanked within days of publication, and this repository
    # has no reason to be among the first to install one. Security updates are a separate mechanism
    # and are not delayed by this, so nothing here slows down a fix for a known vulnerability.
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Everything that is not an analyser can move together; none of it changes a finding.
      dev-tooling:
        patterns: ['*']
        exclude-patterns:
          - 'oxlint'
          - 'oxfmt'
          - 'knip'
          - '@ast-grep/*'
          - '@biomejs/*'
          - 'typescript'
        update-types: [minor, patch]

  # Actions are pinned by commit SHA in the workflows; Dependabot rewrites the pin and the version
  # comment together, which is the only reason pinning is maintainable at all.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
